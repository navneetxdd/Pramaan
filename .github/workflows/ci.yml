name: Pramaan CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    name: Python tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            engine/requirements.txt
            engine/requirements-dev.txt
      - name: Install engine dependencies
        run: python -m pip install --requirement engine/requirements-dev.txt
      - name: Run engine tests
        run: python -m pytest engine/tests -q

  frontend-build:
    name: Frontend type and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Type-check frontend
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build

  api-smoke:
    name: Engine startup smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            engine/requirements.txt
            engine/requirements-dev.txt
      - run: python -m pip install --requirement engine/requirements.txt
      - name: Verify API route surface
        run: python scripts/validation/check_routes.py
      - name: Start engine
        run: |
          FORENSIC_WORKSTATION_DATA="${RUNNER_TEMP}/pramaan-smoke" python run.py > "${RUNNER_TEMP}/pramaan-engine.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/pramaan-engine.pid"
      - name: Verify version endpoint
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "http://127.0.0.1:8787/api/v1/version"
          for attempt in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      payload = json.load(response)
                  if response.status == 200 and payload.get("status") == "ok":
                      raise SystemExit(0)
              except Exception:
                  if attempt == 39:
                      raise
                  time.sleep(0.5)
          raise SystemExit(1)
          PY
      - name: Stop engine
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/pramaan-engine.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/pramaan-engine.pid")" || true
          fi
      - name: Upload engine log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-log
          path: ${{ runner.temp }}/pramaan-engine.log

  pyinstaller-windows:
    name: PyInstaller Windows sidecar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            engine/requirements.txt
            engine/requirements-build.txt
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build frozen engine
        shell: pwsh
        run: ./scripts/build/build-engine.ps1
      - name: Smoke frozen engine
        shell: pwsh
        run: |
          $env:FORENSIC_WORKSTATION_DATA = Join-Path $env:RUNNER_TEMP "pramaan-frozen-smoke"
          $engine = Get-ChildItem "src-tauri/binaries/pramaan-engine-*.exe" | Select-Object -First 1
          $process = Start-Process -FilePath $engine.FullName -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "pramaan-engine.out.log") -RedirectStandardError (Join-Path $env:RUNNER_TEMP "pramaan-engine.err.log")
          try {
            $ready = $false
            foreach ($attempt in 1..180) {
              try {
                $version = Invoke-RestMethod "http://127.0.0.1:8787/api/v1/version" -TimeoutSec 2
                if ($version.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 1000
              }
            }
            if (-not $ready) {
              Get-Content (Join-Path $env:RUNNER_TEMP "pramaan-engine.err.log") -ErrorAction SilentlyContinue | Select-Object -Last 40
              throw "Frozen engine did not become ready."
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: pramaan-engine-windows
          path: |
            src-tauri/binaries/pramaan-engine-*.exe
            src-tauri/binaries/pramaan-engine-*.exe.sha256
          if-no-files-found: error

  tauri-windows:
    name: Tauri Windows installers
    needs: [frontend-build, pyinstaller-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pramaan-engine-windows
          path: src-tauri/binaries
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Sign engine sidecar before bundling
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $sidecar = Get-ChildItem "src-tauri/binaries/pramaan-engine-*.exe" | Select-Object -First 1
          ./scripts/build/sign-windows.ps1 -Paths $sidecar.FullName
          $hash = (Get-FileHash $sidecar.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$($sidecar.FullName).sha256" "$hash  $($sidecar.Name)" -Encoding ascii
      - name: Build Tauri installers
        shell: pwsh
        run: ./scripts/build/build-windows.ps1 -SkipEngine
      - name: Sign and verify release artifacts
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $paths = @("src-tauri/target/release/pramaan-desktop.exe")
          $paths += (Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi" }).FullName
          ./scripts/build/sign-windows.ps1 -Paths $paths
      - uses: actions/upload-artifact@v4
        with:
          name: pramaan-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  windows-release:
    name: Windows release installers
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            engine/requirements.txt
            engine/requirements-build.txt

      - uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install frontend and packaging dependencies
        shell: pwsh
        run: |
          npm ci
          python -m pip install --disable-pip-version-check `
            --requirement engine/requirements.txt `
            --requirement engine/requirements-build.txt

      - name: Build engine sidecar (PyInstaller)
        shell: pwsh
        run: |
          $TargetTriple = "x86_64-pc-windows-msvc"
          $DistRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/pyinstaller/dist"
          $WorkRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/pyinstaller/work"
          $BinaryRoot = Join-Path $env:GITHUB_WORKSPACE "src-tauri/binaries"
          if (-not $env:SOURCE_DATE_EPOCH) {
            $commitEpoch = (& git log -1 --format=%ct 2>$null).Trim()
            $env:SOURCE_DATE_EPOCH = if ($commitEpoch -match "^\d+$") { $commitEpoch } else { "1704067200" }
          }
          $env:PYTHONHASHSEED = "0"
          New-Item -ItemType Directory -Force -Path $DistRoot, $WorkRoot, $BinaryRoot | Out-Null
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --distpath $DistRoot `
            --workpath $WorkRoot `
            engine/pyinstaller.spec
          $SidecarPath = Join-Path $BinaryRoot "pramaan-engine-$TargetTriple.exe"
          Copy-Item (Join-Path $DistRoot "pramaan-engine.exe") $SidecarPath -Force
          $Hash = (Get-FileHash -LiteralPath $SidecarPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$SidecarPath.sha256" -Value "$Hash  pramaan-engine-$TargetTriple.exe" -Encoding ascii

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: --bundles nsis,msi

      # TODO: Authenticode-sign the NSIS installer when WINDOWS_CERTIFICATE_BASE64 and
      # WINDOWS_CERTIFICATE_PASSWORD secrets are configured (see scripts/sign-windows.ps1).

      - uses: actions/upload-artifact@v4
        with:
          name: pramaan-windows-release
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
